<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Livro-Caixa</title>
<meta name="description" content="Controle diário de despesas e economia" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Livro-Caixa" />
<meta name="theme-color" content="#26241F" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root {
  --paper: #F1EDE4;
  --paper-line: #DAD3C2;
  --ink: #26241F;
  --ink-soft: #6B6558;
  --green: #2F6B4F;
  --green-soft: #E4EDE6;
  --stamp-red: #A63D33;
  --stamp-red-soft: #F3E1DD;
  --gold: #B8893F;
  --mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #E8E3D6; }
body { font-family: 'Inter', sans-serif; color: var(--ink); }
input, select, button { font-family: 'Inter', sans-serif; }
input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.55; }
#root { min-height: 100vh; }
@media print {
  body * { visibility: hidden; }
  .report-print, .report-print * { visibility: visible; }
  .report-print { position: absolute; top: 0; left: 0; width: 100%; box-shadow: none !important; border: none !important; max-height: none !important; }
  .no-print { display: none !important; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ---------------------------------------------------------------------------
// Icons (minimal inline SVG set — no external icon library needed)
// ---------------------------------------------------------------------------
function Icon({ name, size = 16, color = "currentColor", strokeWidth = 2 }) {
  const p = { fill: "none", stroke: color, strokeWidth, strokeLinecap: "round", strokeLinejoin: "round" };
  const paths = {
    plus: <><line x1="12" y1="5" x2="12" y2="19" {...p} /><line x1="5" y1="12" x2="19" y2="12" {...p} /></>,
    trash: <><path d="M4 7h16" {...p} /><path d="M9 7V4h6v3" {...p} /><path d="M6 7l1 13h10l1-13" {...p} /></>,
    receipt: <><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z" {...p} /><line x1="9" y1="8" x2="15" y2="8" {...p} /><line x1="9" y1="12" x2="15" y2="12" {...p} /></>,
    dashboard: <><rect x="4" y="4" width="7" height="7" rx="1" {...p} /><rect x="13" y="4" width="7" height="7" rx="1" {...p} /><rect x="4" y="13" width="7" height="7" rx="1" {...p} /><rect x="13" y="13" width="7" height="7" rx="1" {...p} /></>,
    book: <><path d="M4 5c0-1 1-2 2-2h6v16H6c-1 0-2 1-2 2V5z" {...p} /><path d="M20 5c0-1-1-2-2-2h-6v16h6c1 0 2 1 2 2V5z" {...p} /></>,
    card: <><rect x="3" y="6" width="18" height="12" rx="2" {...p} /><line x1="3" y1="10" x2="21" y2="10" {...p} /></>,
    qr: <><rect x="4" y="4" width="6" height="6" {...p} /><rect x="14" y="4" width="6" height="6" {...p} /><rect x="4" y="14" width="6" height="6" {...p} /><line x1="15" y1="15" x2="15" y2="15" {...p} /><line x1="19" y1="15" x2="19" y2="15" {...p} /><line x1="15" y1="19" x2="15" y2="19" {...p} /><line x1="19" y1="19" x2="19" y2="19" {...p} /></>,
    cash: <><rect x="2" y="7" width="20" height="10" rx="2" {...p} /><circle cx="12" cy="12" r="3" {...p} /></>,
    download: <><path d="M12 4v11" {...p} /><path d="M7 11l5 5 5-5" {...p} /><line x1="5" y1="20" x2="19" y2="20" {...p} /></>,
    printer: <><path d="M6 9V3h12v6" {...p} /><rect x="4" y="9" width="16" height="8" rx="1" {...p} /><path d="M6 17v4h12v-4" {...p} /></>,
    file: <><path d="M6 2h9l3 3v17H6V2z" {...p} /><line x1="9" y1="9" x2="15" y2="9" {...p} /><line x1="9" y1="13" x2="15" y2="13" {...p} /><line x1="9" y1="17" x2="13" y2="17" {...p} /></>,
    check: <path d="M4 12l5 5 11-11" {...p} />,
    x: <><line x1="5" y1="5" x2="19" y2="19" {...p} /><line x1="19" y1="5" x2="5" y2="19" {...p} /></>,
    alert: <><path d="M12 3l10 18H2z" {...p} /><line x1="12" y1="10" x2="12" y2="15" {...p} /><line x1="12" y1="18" x2="12" y2="18" {...p} /></>,
    trend: <><path d="M4 6l7 7 4-4 5 5" {...p} /><path d="M20 10v4h-4" {...p} /></>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24">{paths[name] || null}</svg>;
}

// ---------------------------------------------------------------------------
// Categorization engine
// ---------------------------------------------------------------------------
const PAYMENT_METHODS = [
  { id: "cartao", label: "Cartão", icon: "card" },
  { id: "pix", label: "Pix", icon: "qr" },
  { id: "especie", label: "Espécie", icon: "cash" },
];
function paymentInfo(id) { return PAYMENT_METHODS.find((p) => p.id === id) || PAYMENT_METHODS[0]; }

const CATEGORIES = [
  { id: "alimentacao", label: "Alimentação", color: "#2F6B4F", keywords: ["mercado","supermercado","feira","padaria","restaurante","lanchonete","comida","almoco","almoço","jantar","cafe","café","acougue","açougue","hortifruti"] },
  { id: "delivery", label: "Delivery/Apps", color: "#A63D33", keywords: ["ifood","rappi","uber eats","delivery","entrega"], superfluous: true },
  { id: "transporte", label: "Transporte", color: "#4A6FA5", keywords: ["uber","99","taxi","táxi","gasolina","combustivel","combustível","estacionamento","pedagio","pedágio","onibus","ônibus","metro","metrô","passagem"] },
  { id: "moradia", label: "Moradia", color: "#7A5C3E", keywords: ["aluguel","condominio","condomínio","luz","energia","agua","água","internet","gas","gás","iptu","reforma"] },
  { id: "saude", label: "Saúde", color: "#3B7A7A", keywords: ["farmacia","farmácia","remedio","remédio","medico","médico","consulta","plano de saude","academia","dentista","exame"] },
  { id: "lazer", label: "Lazer", color: "#B8893F", keywords: ["cinema","bar","show","viagem","balada","festa","jogo","parque","passeio"], superfluous: true },
  { id: "assinaturas", label: "Assinaturas", color: "#8B5FA3", keywords: ["netflix","spotify","amazon prime","disney","hbo","assinatura","mensalidade","youtube premium","icloud"], superfluous: true },
  { id: "compras", label: "Compras", color: "#C77B4B", keywords: ["roupa","loja","shopping","eletronico","eletrônico","presente","tenis","tênis","calcado","calçado"], superfluous: true },
  { id: "educacao", label: "Educação", color: "#4C6B8A", keywords: ["curso","livro","faculdade","escola","material escolar"] },
  { id: "outros", label: "Outros", color: "#6B6558", keywords: [] },
];
const IMPULSE_HINTS = ["impulso","bebida","cigarro","aposta","bet"];

function normalize(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function autoCategorize(description) {
  const n = normalize(description);
  for (const cat of CATEGORIES) { if (cat.keywords.some((k) => n.includes(normalize(k)))) return cat.id; }
  return "outros";
}
function suggestUnnecessary(description, categoryId) {
  const n = normalize(description);
  const cat = CATEGORIES.find((c) => c.id === categoryId);
  if (IMPULSE_HINTS.some((k) => n.includes(k))) return true;
  return !!(cat && cat.superfluous);
}
function catInfo(id) { return CATEGORIES.find((c) => c.id === id) || CATEGORIES[CATEGORIES.length - 1]; }
function fmtBRL(v) { return (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function monthKey(dateStr) { return (dateStr || "").slice(0, 7); }
function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
}
function formatDatePt(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}`;
}

const STORAGE_KEY = "livro-caixa:lancamentos";

// ---------------------------------------------------------------------------
// Main component
// ---------------------------------------------------------------------------
function LivroCaixa() {
  const [tab, setTab] = useState("lancar");
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState("idle");
  const [currentMonth, setCurrentMonth] = useState(monthKey(todayISO()));

  const [desc, setDesc] = useState("");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayISO());
  const [category, setCategory] = useState(null);
  const [unnecessary, setUnnecessary] = useState(null);
  const [payment, setPayment] = useState("cartao");
  const [justAdded, setJustAdded] = useState(false);
  const [showReport, setShowReport] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setEntries(JSON.parse(raw));
    } catch (e) {
      // corrupted or unavailable — start fresh, user still has export/import backup
    }
    setLoading(false);
  }, []);

  const persist = useCallback((next) => {
    setSaveStatus("saving");
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      setSaveStatus("saved");
      setTimeout(() => setSaveStatus((s) => (s === "saved" ? "idle" : s)), 1500);
    } catch (e) {
      setSaveStatus("error");
    }
  }, []);

  useEffect(() => {
    const n = normalize(desc);
    if (n.trim().length < 2) { setCategory(null); setUnnecessary(null); return; }
    const c = autoCategorize(desc);
    setCategory(c);
    setUnnecessary(suggestUnnecessary(desc, c));
  }, [desc]);

  const addEntry = () => {
    const val = parseFloat((amount || "").replace(",", "."));
    if (!desc.trim() || isNaN(val) || val <= 0) return;
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      desc: desc.trim(), amount: val, date,
      category: category || "outros", unnecessary: !!unnecessary, payment,
    };
    const next = [entry, ...entries];
    setEntries(next);
    persist(next);
    setDesc(""); setAmount(""); setCategory(null); setUnnecessary(null); setPayment("cartao");
    setJustAdded(true);
    setTimeout(() => setJustAdded(false), 1400);
  };

  const removeEntry = (id) => {
    const next = entries.filter((e) => e.id !== id);
    setEntries(next);
    persist(next);
  };

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `livro-caixa-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const exportMonthlySummary = (monthKeyToExport, monthLabelFn) => {
    const monthEntriesForExport = entries.filter((e) => monthKey(e.date) === monthKeyToExport);
    const total = monthEntriesForExport.reduce((s, e) => s + e.amount, 0);
    const unnecessaryTotal = monthEntriesForExport.filter((e) => e.unnecessary).reduce((s, e) => s + e.amount, 0);
    const pct = total > 0 ? (unnecessaryTotal / total) * 100 : 0;

    const catMap = {};
    monthEntriesForExport.forEach((e) => { catMap[e.category] = (catMap[e.category] || 0) + e.amount; });
    const catLines = CATEGORIES.map((c) => ({ label: c.label, total: catMap[c.id] || 0 }))
      .filter((c) => c.total > 0).sort((a, b) => b.total - a.total);

    const payMap = {};
    monthEntriesForExport.forEach((e) => { const p = e.payment || "cartao"; payMap[p] = (payMap[p] || 0) + e.amount; });
    const payLines = PAYMENT_METHODS.map((p) => ({ label: p.label, total: payMap[p.id] || 0 })).filter((p) => p.total > 0);

    const pad = (s, n) => (s + " ".repeat(n)).slice(0, n);
    const money = (v) => fmtBRL(v).padStart(14, " ");
    const line = "-".repeat(38);

    let txt = "";
    txt += `LIVRO-CAIXA — RESUMO MENSAL\n`;
    txt += `${monthLabelFn(monthKeyToExport)}\n`;
    txt += `${line}\n\n`;
    txt += `Total gasto:${money(total)}\n`;
    txt += `Gasto desnecessário:${money(unnecessaryTotal)}\n`;
    txt += `% desnecessário: ${pct.toFixed(0)}%\n`;
    txt += `Lançamentos: ${monthEntriesForExport.length}\n\n`;
    txt += `POR CATEGORIA\n${line}\n`;
    catLines.forEach((c) => { txt += `${pad(c.label, 22)}${money(c.total)}\n`; });
    txt += `\nPOR FORMA DE PAGAMENTO\n${line}\n`;
    payLines.forEach((p) => { txt += `${pad(p.label, 22)}${money(p.total)}\n`; });
    txt += `\ngerado em ${new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" })}\n`;

    const blob = new Blob([txt], { type: "text/plain;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `resumo-mensal-${monthKeyToExport}.txt`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("formato inválido");
        setEntries(parsed);
        persist(parsed);
      } catch (e) { setSaveStatus("error"); }
    };
    reader.readAsText(file);
  };

  const monthEntries = useMemo(() => entries.filter((e) => monthKey(e.date) === currentMonth), [entries, currentMonth]);
  const months = useMemo(() => {
    const set = new Set(entries.map((e) => monthKey(e.date)));
    set.add(currentMonth);
    return Array.from(set).sort().reverse();
  }, [entries, currentMonth]);

  const totalMonth = monthEntries.reduce((s, e) => s + e.amount, 0);
  const totalUnnecessary = monthEntries.filter((e) => e.unnecessary).reduce((s, e) => s + e.amount, 0);
  const pctUnnecessary = totalMonth > 0 ? (totalUnnecessary / totalMonth) * 100 : 0;

  const byCategory = useMemo(() => {
    const map = {};
    monthEntries.forEach((e) => { map[e.category] = (map[e.category] || 0) + e.amount; });
    return CATEGORIES.map((c) => ({ id: c.id, name: c.label, color: c.color, total: map[c.id] || 0 }))
      .filter((c) => c.total > 0).sort((a, b) => b.total - a.total);
  }, [monthEntries]);

  const byPayment = useMemo(() => {
    const map = {};
    monthEntries.forEach((e) => { const p = e.payment || "cartao"; map[p] = (map[p] || 0) + e.amount; });
    return PAYMENT_METHODS.map((p) => ({ ...p, total: map[p.id] || 0 })).filter((p) => p.total > 0);
  }, [monthEntries]);

  const topUnnecessary = useMemo(() => {
    const map = {};
    monthEntries.filter((e) => e.unnecessary).forEach((e) => { map[e.category] = (map[e.category] || 0) + e.amount; });
    return Object.entries(map).map(([id, total]) => ({ id, total, label: catInfo(id).label }))
      .sort((a, b) => b.total - a.total).slice(0, 4);
  }, [monthEntries]);

  const monthLabel = (mk) => {
    const [y, m] = mk.split("-");
    const names = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
    return `${names[parseInt(m, 10) - 1]} de ${y}`;
  };

  return (
    <div style={styles.page}>
      <div style={styles.sheet}>
        <Header saveStatus={saveStatus} onExport={exportBackup} onImport={importBackup} hasEntries={entries.length > 0} />
        <Tabs tab={tab} setTab={setTab} />
        {loading ? (
          <div style={styles.loadingBox}>carregando seu livro-caixa…</div>
        ) : tab === "lancar" ? (
          <LancarTab
            desc={desc} setDesc={setDesc} amount={amount} setAmount={setAmount}
            date={date} setDate={setDate} category={category} setCategory={setCategory}
            unnecessary={unnecessary} setUnnecessary={setUnnecessary}
            payment={payment} setPayment={setPayment} addEntry={addEntry}
            justAdded={justAdded} recent={entries.slice(0, 5)} removeEntry={removeEntry}
          />
        ) : tab === "extrato" ? (
          <ExtratoTab months={months} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth}
            monthLabel={monthLabel} monthEntries={monthEntries} removeEntry={removeEntry} />
        ) : (
          <PainelTab months={months} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth}
            monthLabel={monthLabel} totalMonth={totalMonth} totalUnnecessary={totalUnnecessary}
            pctUnnecessary={pctUnnecessary} byCategory={byCategory} topUnnecessary={topUnnecessary}
            byPayment={byPayment} entryCount={monthEntries.length}
            onGenerateReport={() => setShowReport(true)}
            onExportSummary={() => exportMonthlySummary(currentMonth, monthLabel)} />
        )}
      </div>
      {showReport && (
        <ReportModal onClose={() => setShowReport(false)} monthLabel={monthLabel(currentMonth)}
          currentMonth={currentMonth} entries={monthEntries} totalMonth={totalMonth}
          totalUnnecessary={totalUnnecessary} pctUnnecessary={pctUnnecessary}
          byCategory={byCategory} byPayment={byPayment} />
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Sub-components
// ---------------------------------------------------------------------------
function Header({ saveStatus, onExport, onImport, hasEntries }) {
  const fileInputRef = useRef(null);
  return (
    <div style={styles.header}>
      <div style={styles.headerTop}>
        <div style={styles.headerLeft}>
          <Icon name="book" size={24} color="var(--ink)" strokeWidth={1.6} />
          <div>
            <div style={styles.title}>Livro-Caixa</div>
            <div style={styles.subtitle}>controle diário de despesas &amp; economia</div>
          </div>
        </div>
        <SaveIndicator status={saveStatus} />
      </div>
      {saveStatus === "error" && (
        <div style={styles.errorBadge}>não foi possível salvar neste dispositivo — exporte um backup para não perder nada.</div>
      )}
      <div style={styles.backupRow}>
        <button onClick={onExport} disabled={!hasEntries} style={{ ...styles.backupBtn, opacity: hasEntries ? 1 : 0.4 }}>
          <Icon name="download" size={12} strokeWidth={2} /> exportar backup
        </button>
        <button onClick={() => fileInputRef.current && fileInputRef.current.click()} style={styles.backupBtn}>
          importar backup
        </button>
        <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }}
          onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) onImport(f); e.target.value = ""; }} />
      </div>
    </div>
  );
}

function SaveIndicator({ status }) {
  if (status === "saving") return <span style={{ ...styles.saveIndicator, color: "var(--ink-soft)" }}>salvando…</span>;
  if (status === "saved") return <span style={{ ...styles.saveIndicator, color: "var(--green)" }}>● salvo</span>;
  if (status === "error") return <span style={{ ...styles.saveIndicator, color: "var(--stamp-red)" }}>● não salvou</span>;
  return null;
}

function Tabs({ tab, setTab }) {
  const items = [
    { id: "lancar", label: "Lançar", icon: "plus" },
    { id: "extrato", label: "Extrato", icon: "receipt" },
    { id: "painel", label: "Painel", icon: "dashboard" },
  ];
  return (
    <div style={styles.tabRow}>
      {items.map((it) => {
        const active = tab === it.id;
        return (
          <button key={it.id} onClick={() => setTab(it.id)} style={{ ...styles.tabBtn, ...(active ? styles.tabBtnActive : {}) }}>
            <Icon name={it.icon} size={15} strokeWidth={2} /> {it.label}
          </button>
        );
      })}
    </div>
  );
}

function LancarTab({ desc, setDesc, amount, setAmount, date, setDate, category, setCategory, unnecessary, setUnnecessary, payment, setPayment, addEntry, justAdded, recent, removeEntry }) {
  const cat = category ? catInfo(category) : null;
  return (
    <div style={styles.body}>
      <div style={styles.ledgerCard}>
        <div style={styles.fieldRow}>
          <label style={styles.label}>descrição</label>
          <input style={styles.input} placeholder="ex: almoço no shopping, uber pro trabalho, netflix…"
            value={desc} onChange={(e) => setDesc(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addEntry()} />
        </div>
        <div style={{ display: "flex", gap: 14 }}>
          <div style={{ ...styles.fieldRow, flex: 1 }}>
            <label style={styles.label}>valor</label>
            <div style={styles.moneyInputWrap}>
              <span style={styles.moneyPrefix}>R$</span>
              <input style={{ ...styles.input, ...styles.moneyInput }} placeholder="0,00" inputMode="decimal"
                value={amount} onChange={(e) => setAmount(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addEntry()} />
            </div>
          </div>
          <div style={{ ...styles.fieldRow, width: 158 }}>
            <label style={styles.label}>data</label>
            <input type="date" style={styles.input} value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
        </div>

        <div style={styles.fieldRow}>
          <label style={styles.label}>forma de pagamento</label>
          <div style={styles.paymentGroup}>
            {PAYMENT_METHODS.map((p) => {
              const active = payment === p.id;
              return (
                <button key={p.id} onClick={() => setPayment(p.id)} style={{ ...styles.paymentBtn, ...(active ? styles.paymentBtnActive : {}) }}>
                  <Icon name={p.icon} size={14} strokeWidth={2} /> {p.label}
                </button>
              );
            })}
          </div>
        </div>

        {desc.trim().length >= 2 && cat && (
          <div style={styles.suggestBox}>
            <div style={styles.suggestRow}>
              <span style={styles.suggestLabel}>categoria sugerida</span>
              <select value={category} onChange={(e) => setCategory(e.target.value)}
                style={{ ...styles.catPill, background: cat.color + "22", color: cat.color, borderColor: cat.color + "55" }}>
                {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
              </select>
            </div>
            <div style={styles.suggestRow}>
              <span style={styles.suggestLabel}>é uma despesa necessária?</span>
              <div style={styles.toggleGroup}>
                <button onClick={() => setUnnecessary(false)} style={{ ...styles.toggleBtn, ...(unnecessary === false ? styles.toggleBtnGreen : {}) }}>necessária</button>
                <button onClick={() => setUnnecessary(true)} style={{ ...styles.toggleBtn, ...(unnecessary === true ? styles.toggleBtnRed : {}) }}>desnecessária</button>
              </div>
            </div>
          </div>
        )}

        <button onClick={addEntry} disabled={!desc.trim() || !amount} style={{ ...styles.addBtn, opacity: !desc.trim() || !amount ? 0.45 : 1 }}>
          <Icon name={justAdded ? "check" : "plus"} size={16} color="var(--paper)" />
          {justAdded ? "lançado" : "lançar despesa"}
        </button>
      </div>

      {recent.length > 0 && (
        <div style={{ marginTop: 22 }}>
          <div style={styles.sectionLabel}>últimos lançamentos</div>
          <div style={styles.ruledList}>
            {recent.map((e) => <EntryRow key={e.id} e={e} onDelete={() => removeEntry(e.id)} />)}
          </div>
        </div>
      )}
    </div>
  );
}

function ExtratoTab({ months, currentMonth, setCurrentMonth, monthLabel, monthEntries, removeEntry }) {

function ReportModal({ onClose, monthLabel, currentMonth, entries, totalMonth, totalUnnecessary, pctUnnecessary, byCategory, byPayment }) {
  const sorted = entries.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const generatedAt = new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });

  const downloadCSV = () => {
    const header = ["data", "descricao", "categoria", "forma de pagamento", "valor", "desnecessaria"];
    const rows = sorted.map((e) => [
      formatDatePt(e.date), `"${e.desc.replace(/"/g, '""')}"`, catInfo(e.category).label,
      paymentInfo(e.payment).label, e.amount.toFixed(2).replace(".", ","), e.unnecessary ? "sim" : "nao",
    ]);
    const csv = [header, ...rows].map((r) => r.join(";")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `relatorio-despesas-${currentMonth}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div style={styles.modalOverlay}>
      <div style={styles.modalCard} className="report-print">
        <div style={styles.modalHeader} className="no-print">
          <div style={styles.modalTitle}><Icon name="file" size={16} /> Relatório do mês</div>
          <button onClick={onClose} style={styles.modalCloseBtn}><Icon name="x" size={16} /></button>
        </div>
        <div style={styles.reportBody}>
          <div style={styles.reportMasthead}>
            <div style={styles.reportMastheadTitle}>Livro-Caixa</div>
            <div style={styles.reportMastheadSub}>relatório de despesas — {monthLabel}</div>
            <div style={styles.reportMastheadDate}>gerado em {generatedAt}</div>
          </div>
          <div style={styles.reportStatRow}>
            <div><div style={styles.reportStatLabel}>total do mês</div><div style={styles.reportStatValue}>{fmtBRL(totalMonth)}</div></div>
            <div><div style={{ ...styles.reportStatLabel, color: "var(--stamp-red)" }}>gasto desnecessário</div><div style={{ ...styles.reportStatValue, color: "var(--stamp-red)" }}>{fmtBRL(totalUnnecessary)}</div></div>
            <div><div style={styles.reportStatLabel}>% desnecessário</div><div style={styles.reportStatValue}>{pctUnnecessary.toFixed(0)}%</div></div>
          </div>
          <div style={styles.reportSectionTitle}>por categoria</div>
          <table style={styles.reportTable}><tbody>
            {byCategory.map((c) => <tr key={c.id} style={styles.reportTableRow}><td style={styles.reportTableCellLabel}>{c.name}</td><td style={styles.reportTableCellValue}>{fmtBRL(c.total)}</td></tr>)}
          </tbody></table>
          <div style={styles.reportSectionTitle}>por forma de pagamento</div>
          <table style={styles.reportTable}><tbody>
            {byPayment.map((p) => <tr key={p.id} style={styles.reportTableRow}><td style={styles.reportTableCellLabel}>{p.label}</td><td style={styles.reportTableCellValue}>{fmtBRL(p.total)}</td></tr>)}
          </tbody></table>
          <div style={styles.reportSectionTitle}>lançamentos ({sorted.length})</div>
          <table style={styles.reportTable}>
            <thead><tr>
              <th style={styles.reportTableHead}>data</th><th style={styles.reportTableHead}>descrição</th>
              <th style={styles.reportTableHead}>categoria</th><th style={styles.reportTableHead}>pagamento</th>
              <th style={{ ...styles.reportTableHead, textAlign: "right" }}>valor</th>
            </tr></thead>
            <tbody>
              {sorted.map((e) => (
                <tr key={e.id} style={styles.reportTableRow}>
                  <td style={styles.reportTableCellSmall}>{formatDatePt(e.date)}</td>
                  <td style={styles.reportTableCellSmall}>{e.desc}{e.unnecessary && <span style={{ color: "var(--stamp-red)", fontWeight: 600 }}> ·</span>}</td>
                  <td style={styles.reportTableCellSmall}>{catInfo(e.category).label}</td>
                  <td style={styles.reportTableCellSmall}>{paymentInfo(e.payment).label}</td>
                  <td style={{ ...styles.reportTableCellSmall, textAlign: "right", fontFamily: "var(--mono)" }}>{fmtBRL(e.amount)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={styles.modalFooter} className="no-print">
          <button onClick={downloadCSV} style={styles.footerBtn}><Icon name="download" size={14} strokeWidth={2} /> baixar CSV</button>
          <button onClick={() => window.print()} style={{ ...styles.footerBtn, ...styles.footerBtnPrimary }}><Icon name="printer" size={14} strokeWidth={2} color="var(--paper)" /> imprimir / salvar PDF</button>
        </div>
      </div>
    </div>
  );
}

function EntryRow({ e, onDelete, showDate }) {
  const cat = catInfo(e.category);
  const pay = paymentInfo(e.payment);
  return (
    <div style={styles.entryRow}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={styles.entryDesc}>{e.desc}</div>
        <div style={styles.entryMeta}>

          <span style={styles.payTag}><Icon name={pay.icon} size={10.5} strokeWidth={2.2} /> {pay.label}</span>
          {showDate && <span style={styles.entryDate}>{formatDatePt(e.date)}</span>}

      <button onClick={onDelete} style={styles.deleteBtn} aria-label="excluir lançamento"><Icon name="trash" size={14} strokeWidth={2} /></button>
